<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Customer Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>   <!-- external file only, no inline JS -->
</head>
<body>
  <main>
    <h1>Customer Directory</h1>

    <form id="add-form" method="post" action="api.php?action=add" novalidate>
      <h2>Add a customer</h2>
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required
             maxlength="100" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required
             maxlength="254" autocomplete="email">

      <label for="city">City</label>
      <input id="city" name="city" type="text" required maxlength="60"
             pattern="[A-Za-z][A-Za-z .'\-]{0,59}" autocomplete="address-level2">

      <button type="submit">Add customer</button>
      <p id="add-status" role="status" aria-live="polite"></p>
    </form>

    <form id="search-form" role="search">
      <h2>Search customers</h2>
      <label for="q">Name contains</label>
      <input id="q" name="q" type="search" maxlength="50" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <p id="search-message" role="status" aria-live="polite"></p>
    <table id="results" hidden>
      <thead><tr><th>Name</th><th>City</th><th>Added</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
</body>
</html>
