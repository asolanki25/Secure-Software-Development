name: Compile and run

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assignment 3 - compile
        run: |
          cd assignment-3
          javac -d out AppLayerSecurity.java OneTimePad.java

      - name: Assignment 3 - run AppLayerSecurity
        run: timeout 120 java -cp assignment-3/out AppLayerSecurity

      - name: Assignment 3 - run OneTimePad
        run: java -cp assignment-3/out OneTimePad

      - name: Assignment 4 - check firewall syntax
        if: hashFiles('assignment-4/linux-firewall.nft') != ''
        run: |
          sudo apt-get install -y nftables
          sudo nft -c -f assignment-4/linux-firewall.nft && echo "Firewall ruleset syntax OK"

      - name: Project 1 - Maven build
        if: hashFiles('project-1/secure-bank/pom.xml') != ''
        run: |
          cd project-1/secure-bank
          mvn -B package -DskipTests

  assignment-5-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Assignment 5 - install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assignment 5 - run create_customer_db.sql
        run: psql -f Assignment5/create_customer_db.sql 2>&1 | tee output.txt

      - name: Assignment 5 - check two rows and bad ZIP code rejected
        run: |
          grep -q "(2 rows)" output.txt
          grep -q 'violates check constraint "customer_zip_check"' output.txt
          echo "Both checks passed."

      - name: Assignment 5 - check customer_app cannot delete rows
        env:
          PGUSER: customer_app
          PGPASSWORD: change_me_outside_source_control
        run: |
          psql -d customer_db -c "SELECT count(*) FROM customer;"
          if psql -d customer_db -c "DELETE FROM customer;" 2> err.txt; then
            echo "DELETE should have been refused."
            exit 1
          fi
          cat err.txt
          grep -q "permission denied" err.txt
          echo "Least-privilege check passed."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assignment 5 - download PostgreSQL JDBC driver
        run: curl -sSL -o postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar

      - name: Assignment 5 - compile and run CustomerDatabase.java (JDBC)
        run: |
          javac -d assignment5-out Assignment5/CustomerDatabase.java
          java -cp assignment5-out:postgresql.jar CustomerDatabase | tee java-output.txt
          grep -q "3 rows inserted." java-output.txt
          grep -q "DROP TABLE customer;--" java-output.txt
          grep -q "Invalid ZIP code rejected (SQLState 23514)" java-output.txt
          echo "JDBC checks passed."

  assignment-6-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assignment 6 - compile Vehicle classes and generics demo
        run: javac -Xlint:unchecked -Xlint:rawtypes -d assignment6-out Assignment6/VehicleDemo.java Assignment6/GenericsDemo.java

      - name: Assignment 6 - run VehicleDemo (inheritance and overriding)
        run: |
          java -cp assignment6-out VehicleDemo | tee vehicle-output.txt
          grep -q "SUV reverses carefully at 8 mph" vehicle-output.txt
          grep -q "SportsCar accelerates forward at 160 mph (capped from 190)" vehicle-output.txt
          grep -q "Hybrid reverses silently at 6 mph" vehicle-output.txt
          grep -q "Rejected -30 mph" vehicle-output.txt
          echo "Vehicle checks passed."

      - name: Assignment 6 - run GenericsDemo (generic class risks)
        run: |
          java -cp assignment6-out GenericsDemo | tee generics-output.txt
          grep -q "Same runtime class: true" generics-output.txt
          grep -q "ClassCastException at read time" generics-output.txt
          echo "Generics checks passed."

  assignment-7-uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assignment 7 - install Graphviz and PlantUML
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar

      - name: Assignment 7 - render the security use case diagram
        run: |
          java -jar plantuml.jar -tpng -o "$PWD/rendered" Assignment7/secure_account_portal_usecase.puml
          test -s rendered/SecureAccountPortal.png
          echo "Diagram rendered."

  assignment-8-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assignment 8 - compile SafeFileReader
        run: javac -d assignment8-out Assignment8/SafeFileReader.java

      - name: Assignment 8 - run and check every bad request fails safely
        run: |
          java -cp assignment8-out SafeFileReader 2>&1 | tee a8-output.txt
          grep -q "SUCCESS -> mode=secure" a8-output.txt
          test "$(grep -c 'FAILED SAFELY' a8-output.txt)" -eq 7
          grep -q "path outside base directory" a8-output.txt
          grep -q "file exceeds size limit" a8-output.txt
          grep -q "invalid UTF-8" a8-output.txt
          grep -q "missing file name" a8-output.txt
          if grep -q "root:" a8-output.txt; then echo "Traversal leaked data"; exit 1; fi
          test "$(grep -c "^  \[log\] INFO AUDIT read request='config.txt' outcome=OK$" a8-output.txt)" -eq 1
          echo "Fail-safe checks passed."
